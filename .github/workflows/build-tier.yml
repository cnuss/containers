name: build-tier

on:
  workflow_call:
    inputs:
      containers:
        description: 'JSON array of {name, dir, version} to build and publish'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(inputs.containers) }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Job-level if can't see the matrix context, so every step gates on the
    # container's supported arches instead; unsupported combos no-op green.
    steps:
      - uses: actions/checkout@v4
        if: contains(matrix.container.arches, matrix.platform.arch)

      - uses: docker/setup-buildx-action@v3
        if: contains(matrix.container.arches, matrix.platform.arch)

      - name: Log in to GHCR
        if: contains(matrix.container.arches, matrix.platform.arch) && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: contains(matrix.container.arches, matrix.platform.arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.container.dir }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            VERSION=${{ matrix.container.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: contains(matrix.container.arches, matrix.platform.arch) && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: contains(matrix.container.arches, matrix.platform.arch) && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.container.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(inputs.containers) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.container.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container.name }}"
          docker buildx imagetools create \
            -t "$image:${{ matrix.container.version }}" \
            -t "$image:latest" \
            $(printf "$image@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container.name }}:latest"
