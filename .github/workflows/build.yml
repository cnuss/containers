name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      tier0: ${{ steps.matrix.outputs.tier0 }}
      tier1: ${{ steps.matrix.outputs.tier1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build container matrix
        id: matrix
        run: |
          matrix=$(
            for dir in */; do
              dir="${dir%/}"
              [ -f "$dir/Dockerfile" ] || continue
              # A leading "<digits>-" prefix sets the build tier and is
              # stripped from the image name; unprefixed dirs are tier 0.
              tier="${dir%%-*}"
              if [ "$tier" != "$dir" ] && [ -n "$tier" ] && [ -z "${tier//[0-9]/}" ]; then
                name="${dir#*-}"
              else
                tier=0
                name="$dir"
              fi
              if [ -x "$dir/version.sh" ]; then
                version="$("./$dir/version.sh")"
              else
                version="$(date +%Y%m%d)"
              fi
              printf '{"tier":%d,"name":"%s","dir":"%s","version":"%s"}\n' \
                "$tier" "$name" "$dir" "$version"
            done | jq -cs 'sort_by(.tier)'
          )
          echo "matrix: $matrix"
          echo "tier0=$(jq -c '[.[] | select(.tier == 0)]' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "tier1=$(jq -c '[.[] | select(.tier >= 1)]' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  tier0:
    needs: discover
    if: needs.discover.outputs.tier0 != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-tier.yml
    with:
      containers: ${{ needs.discover.outputs.tier0 }}

  tier1:
    needs: [discover, tier0]
    # Run even when tier0 is skipped (empty), but not when it failed
    if: ${{ !cancelled() && !failure() && needs.discover.outputs.tier1 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-tier.yml
    with:
      containers: ${{ needs.discover.outputs.tier1 }}
