# Chrome, Claude Code, and a zsh shell in one set of shared namespaces,
# rooted at the base container: chrome and claude-code join its network,
# PID, and IPC namespaces. The xpra HTML5 client is at
# http://localhost:14500.
#
# Services build from the local Dockerfiles. Build the base first so the
# leaf images pick up the local tag instead of pulling from GHCR:
#
#   docker compose build base && docker compose build
#   docker compose up -d
#   docker compose exec base zsh       # a shell in the namespace root
#   docker compose attach claude-code # interactive Claude Code
# Each volume mounts at a path the owning image bakes user-owned, so
# docker's copy-on-first-use seeds fresh volumes with the right ownership
x-volumes: &volumes
  - cache:/home/user/.cache
  - claude:/home/user/.claude
  - config:/home/user/.config
  - home:/home/user

services:
  base:
    build: ./0-ubuntu
    image: ghcr.io/cnuss/ubuntu:built
    hostname: containers # inherited by the joining services (shared UTS)
    command: ["sleep", "infinity"]
    ipc: shareable # let the other services join this IPC namespace
    ports:
      - "14500:14500" # xpra HTML5 client, served by the chrome service
    volumes: *volumes

  chrome:
    build: ./1-google-chrome
    image: ghcr.io/cnuss/google-chrome:built
    # Chrome disables CDP on its default profile dir; uncomment to serve it
    # on 127.0.0.1:9222 inside the shared network namespace:
    # command: ["--user-data-dir=/home/user/chrome-profile"]
    network_mode: service:base
    pid: service:base
    ipc: service:base
    depends_on: [base]
    volumes: *volumes

  claude-code:
    build: ./1-claude-code
    image: ghcr.io/cnuss/claude-code:built
    command: ["--debug"]
    network_mode: service:base
    pid: service:base
    ipc: service:base
    depends_on: [base]
    stdin_open: true
    tty: true
    volumes: *volumes

  tunnel:
    image: ghcr.io/cnuss/libtunnel:latest
    network_mode: service:base
    pid: service:base
    ipc: service:base
    depends_on: [base, chrome, claude-code]
    volumes: *volumes
    environment:
      - LIBTUNNEL_LOCAL_URL=http://localhost:14500
      - LIBTUNNEL__CLOUDFLARE=1

volumes:
  cache:
  claude:
  config:
  home:
